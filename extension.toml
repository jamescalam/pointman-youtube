# YouTube on Pointman: the publishing behaviour (research, titles, thumbnails, descriptions, picked by the channel's
# owner), and since 0.3.0 a process that uploads videos and edits their details on the channel through the YouTube
# Data API v3. The channel is signed in from the apps with Google's device flow; the OAuth client and each sign-in's
# refresh token live in the vault, never in a file.
#
# The commands' params and [settings] are written from proto/youtube/v1/youtube.proto (`<Verb>Params`, `Settings`):
# change the proto, then the schemas here.

[extension]
id = "youtube"
name = "YouTube"
version = "0.3.0"
publisher = "jamescalam"
summary = "Upload videos and edit their titles, descriptions, tags and thumbnails on a YouTube channel, with research and packaging the channel's owner picks."
node = ">=0.3,<1"
platforms = ["macos-arm64", "macos-x86_64", "linux-x86_64", "linux-arm64"]

[run]
command = ["bin/youtube"]
runtime = "binary"

[behavior]
skill = "SKILL.md"
clients = ["claude", "codex", "gemini"]
files = ["references", "scripts"]

[permissions]
network = true                   # YouTube's Data API and Google's OAuth endpoints
secrets = ["youtube.*"]          # youtube.client (the OAuth client) and youtube.<label> (each channel's sign-in)

# The Google OAuth client the sign-ins go through: a "TVs and Limited Input devices" client in a Google Cloud project
# with the YouTube Data API v3 turned on.
[[credentials]]
id = "client"
title = "Google OAuth client"
help = "In Google Cloud console: APIs & Services › Credentials › Create OAuth client ID › TVs and Limited Input devices. Paste its client ID, a space, then its client secret."
item = "youtube.client"
value = '[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com[\s:]+[A-Za-z0-9_-]{16,128}'
placeholder = "123-abc.apps.googleusercontent.com GOCSPX-…"

# A channel: Sign in from the apps (Google's device flow), kept as its refresh token.
[[credentials]]
id = "account"
title = "YouTube channel"
help = "Sign in as the Google account that owns the channel (add the Google OAuth client first). Or paste a refresh token made with the same client."
item = "youtube.{label}"
value = '1//[A-Za-z0-9_-]{20,512}'
placeholder = "1//0g…"
sign_in = true

[settings]
type = "object"
additionalProperties = false

[settings.properties.account]
type = "string"
description = "The label of the YouTube sign-in to use (main, for the vault's youtube.main). Empty: the first, by label."
maxLength = 32
pattern = "^([a-z0-9][a-z0-9._-]*)?$"
default = ""

[settings.properties.chunk_mib]
type = "integer"
description = "How much of a video each upload request sends, in MiB (default 8). A dropped connection resends at most one."
minimum = 1
maximum = 256
default = 8

[[commands]]
kind = "youtube.videos"
title = "List the channel's videos, newest first"
slash = "videos"
summary = "The channel's videos: id, title, privacy, publish time and views, newest first"
[commands.params]
type = "object"
additionalProperties = false
[commands.params.properties.page_size]
type = "integer"
description = "How many videos to list (default 20)."
minimum = 1
maximum = 50
[commands.params.properties.page]
type = "string"
description = "The next page: an earlier answer's next_page. Empty: the newest."
maxLength = 200

[[commands]]
kind = "youtube.video"
title = "One video's details (video)"
slash = "video"
summary = "A video's title, description, tags, category, privacy and schedule, as youtube.update changes them"
[commands.params]
type = "object"
required = ["video"]
additionalProperties = false
[commands.params.properties.video]
type = "string"
description = "The video's id: the 11 characters after watch?v= or youtu.be/."
pattern = "^[A-Za-z0-9_-]{11}$"

[[commands]]
kind = "youtube.upload"
title = "Upload a video (file, title, …, confirm)"
lane = "upload"
cancellable = true
resumable = true
slash = "upload"
summary = "Upload a video to the channel, private unless said; needs confirm=true, given once the owner said yes"
[commands.params]
type = "object"
required = ["file", "title"]
additionalProperties = false
[commands.params.properties.file]
type = "string"
description = "The video: a board file (pointman://asset/<id>, which the node fetches) or a path in the folders the node lets the extension use."
minLength = 1
[commands.params.properties.title]
type = "string"
description = "Its title: at most 100 characters, without < or >."
minLength = 1
maxLength = 100
pattern = "^[^<>]*$"
[commands.params.properties.description]
type = "string"
description = "Its description: at most 5,000 bytes, without < or >."
pattern = "^[^<>]*$"
[commands.params.properties.tags]
type = "array"
description = "Its tags, most important first: at most 500 characters in all, counting a comma between each and 2 for a tag with a space."
maxItems = 100
items = { type = "string", minLength = 1, maxLength = 100 }
[commands.params.properties.category]
type = "string"
description = "Its category (default people_blogs, YouTube's own default)."
enum = ["film_animation", "autos_vehicles", "music", "pets_animals", "sports", "travel_events", "gaming", "people_blogs", "comedy", "entertainment", "news_politics", "howto_style", "education", "science_technology", "nonprofits_activism"]
[commands.params.properties.privacy]
type = "string"
description = "Who can see it (default private)."
enum = ["private", "unlisted", "public"]
[commands.params.properties.publish_at]
type = "string"
format = "date-time"
description = "When it goes public by itself (RFC 3339, 2026-11-02T15:00:00Z), in the future. Only for a private video."
[commands.params.properties.made_for_kids]
type = "boolean"
description = "Whether it's made for kids. Left out: the channel's default from YouTube Studio."
[commands.params.properties.thumbnail]
type = "string"
description = "A thumbnail to set once it's up: a JPEG or PNG path on this machine, at most 2 MB. A board file goes through youtube.thumbnail afterwards."
[commands.params.properties.playlist]
type = "string"
description = "A playlist to add it to: its id (PL…)."
maxLength = 64
pattern = "^([A-Za-z0-9_-]+)?$"
[commands.params.properties.confirm]
type = "boolean"
description = "True once the channel's owner has said yes to this upload. Without it, nothing is uploaded."

[[commands]]
kind = "youtube.update"
title = "Change a video's details (video, title?, …, confirm?)"
slash = "update"
summary = "Change a video's title, description, tags, category, privacy or schedule; a public one needs confirm=true"
[commands.params]
type = "object"
required = ["video"]
additionalProperties = false
[commands.params.properties.video]
type = "string"
description = "The video's id: the 11 characters after watch?v= or youtu.be/."
pattern = "^[A-Za-z0-9_-]{11}$"
[commands.params.properties.title]
type = "string"
description = "A new title: at most 100 characters, without < or >."
minLength = 1
maxLength = 100
pattern = "^[^<>]*$"
[commands.params.properties.description]
type = "string"
description = "A new description, all of it: at most 5,000 bytes, without < or >."
pattern = "^[^<>]*$"
[commands.params.properties.tags]
type = "array"
description = "New tags, replacing all of them. Empty or left out: unchanged."
maxItems = 100
items = { type = "string", minLength = 1, maxLength = 100 }
[commands.params.properties.category]
type = "string"
description = "A new category."
enum = ["film_animation", "autos_vehicles", "music", "pets_animals", "sports", "travel_events", "gaming", "people_blogs", "comedy", "entertainment", "news_politics", "howto_style", "education", "science_technology", "nonprofits_activism"]
[commands.params.properties.privacy]
type = "string"
description = "Who can see it. Public publishes it."
enum = ["private", "unlisted", "public"]
[commands.params.properties.publish_at]
type = "string"
format = "date-time"
description = "When it goes public by itself (RFC 3339), in the future: it stays private until then."
[commands.params.properties.made_for_kids]
type = "boolean"
description = "Whether it's made for kids."
[commands.params.properties.confirm]
type = "boolean"
description = "True once the channel's owner has said yes. Needed to change a public video, make one public or schedule it."

[[commands]]
kind = "youtube.thumbnail"
title = "Set a video's thumbnail (video, file, confirm?)"
slash = "thumbnail"
summary = "Set a video's thumbnail from a JPEG or PNG; a public video's needs confirm=true"
[commands.params]
type = "object"
required = ["video", "file"]
additionalProperties = false
[commands.params.properties.video]
type = "string"
description = "The video's id: the 11 characters after watch?v= or youtu.be/."
pattern = "^[A-Za-z0-9_-]{11}$"
[commands.params.properties.file]
type = "string"
description = "The image: a board file (pointman://asset/<id>) or a path in the extension's folders. A JPEG or PNG, at most 2 MB."
minLength = 1
[commands.params.properties.confirm]
type = "boolean"
description = "True once the channel's owner has said yes. Needed for a public video's."

[[commands]]
kind = "youtube.add"
title = "Add a YouTube channel"
slash = "add"
form = "account"
summary = "Sign a YouTube channel in for this machine's uploads and edits"
[commands.params]
type = "object"
additionalProperties = false
[commands.params.properties.name]
type = "string"
description = "What to call it (main): lowercase letters, digits, . _ -"
maxLength = 32
pattern = "^([a-z0-9][a-z0-9._-]*)?$"

[[commands]]
kind = "youtube.client"
title = "Add the Google OAuth client"
slash = "client"
form = "client"
summary = "Add the Google OAuth client that YouTube sign-ins go through"
[commands.params]
type = "object"
additionalProperties = false
