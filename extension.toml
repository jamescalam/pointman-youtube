[[commands]]
kind = "youtube.chat_watch"
title = "Post a live chat to a Pointman channel (video, channel, …)"
cancellable = true
slash = "chat-watch"
summary = "Post a live video's new chat messages to a Pointman channel in batches until cancelled or the chat ends"

# From ChatWatchParams in proto/youtube/v1/youtube.proto: `pointman-extension manifest write`
[commands.params]
type = "object"
description = "youtube.chat_watch: a live video's new chat messages posted to a Pointman channel in batches, until it's cancelled, the chat ends or minutes have gone by."
required = ["video", "channel"]
additionalProperties = false

[commands.params.properties.video]
type = "string"
description = "The live video's id: the 11 characters after watch?v= or youtu.be/."
pattern = "^[A-Za-z0-9_-]{11}$"

[commands.params.properties.channel]
type = "string"
description = "The Pointman channel each batch is posted in (ch_123)."
pattern = "^(ch_)?[1-9][0-9]*$"

[commands.params.properties.every_seconds]
type = "integer"
description = "How often it posts the messages since the last batch, in seconds (default 15; never sooner than YouTube asks)."
default = 15
minimum = 5
maximum = 300

[commands.params.properties.mention]
type = "string"
description = "Who a batch @mentions (an agent's handle), so it wakes for each one. Empty: nobody."
maxLength = 65
pattern = "^(@?[a-z0-9][a-z0-9_-]{0,63})?$"

[commands.params.properties.minutes]
type = "integer"
description = "How long it watches at most, in minutes (default 180)."
default = 180
minimum = 1
maximum = 720

[commands.params.properties.account]
type = "string"
description = "The label of the YouTube sign-in to use for this call (spacesheep, for the vault's youtube.spacesheep), instead of the account setting."
maxLength = 32
pattern = "^([a-z0-9][a-z0-9._-]*)?$"

