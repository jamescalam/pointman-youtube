# The extension's release (extension.toml: `runtime = "binary"`, `command = ["bin/<id>"]`; Pointman's
# docs/dev/extensions.md, "Compiled extensions").
#
# Push a tag that's extension.toml's version (`git tag v0.3.0 && git push origin v0.3.0`): each
# platform is built on its own runner and packed as <id>-<version>-<platform>.tar.gz, the files at
# its top (extension.toml, bin/<id>, SKILL.md, references/ and scripts/: the agents' guidance its [behavior]
# names, README.md, LICENSE). Then one job makes the release with every archive attached. gh keeps it a draft until they're all up, so core's `released` delivery finds
# each platform in `platforms`; one missing is refused.
#
# Linux builds are musl, so static: they run on any distribution, NixOS included, whose loader
# isn't where a glibc build looks for it. Both Macs build on one macos-15 runner, the Intel one cross-compiled
# (GitHub retired its macos-13 runners), so that's the one build whose tests don't run. One runner, not two: GitHub's
# arm64 Macs are short at times, and a second Mac job can wait in the queue until GitHub gives up on it.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BIN: ""                 # the cargo binary's name, when it isn't the extension's id

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # targets and platforms pair up in order; tests run for `test`, the runner's own
          - { name: macos, runner: macos-15, targets: "aarch64-apple-darwin,x86_64-apple-darwin", platforms: "macos-arm64 macos-x86_64", test: aarch64-apple-darwin }
          - { name: linux-x86_64, runner: ubuntu-24.04, targets: x86_64-unknown-linux-musl, platforms: linux-x86_64, test: x86_64-unknown-linux-musl }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, targets: aarch64-unknown-linux-musl, platforms: linux-arm64, test: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Its id and version, and the tag's
        run: |
          id=$(sed -n 's/^id = "\(.*\)"/\1/p' extension.toml | head -1)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' extension.toml | head -1)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "the tag is $GITHUB_REF_NAME but extension.toml's version is $version" >&2
            exit 1
          fi
          echo "ID=$id" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: cargo test --locked --target ${{ matrix.test }}
      # the Google OAuth client sign-ins go through when a node has none of its own (src/google.rs): only in this
      # build, so the tests above keep the fake's
      - name: Build, with the default client
        env:
          YOUTUBE_DEFAULT_CLIENT: ${{ secrets.YOUTUBE_DEFAULT_CLIENT }}
        run: |
          if [ -z "$YOUTUBE_DEFAULT_CLIENT" ]; then
            echo "the repo has no YOUTUBE_DEFAULT_CLIENT secret: a release is built with the default client" >&2
            exit 1
          fi
          for target in $(echo "${{ matrix.targets }}" | tr , ' '); do
            cargo build --release --locked --target "$target"
          done
      - name: Pack ${{ matrix.platforms }}
        run: |
          set -- ${{ matrix.platforms }}
          for target in $(echo "${{ matrix.targets }}" | tr , ' '); do
            platform=$1; shift
            rm -rf pkg && mkdir -p pkg/bin
            cp "target/$target/release/${BIN:-$ID}" "pkg/bin/$ID"
            chmod 755 "pkg/bin/$ID"
            cp -R extension.toml SKILL.md references scripts README.md LICENSE pkg/
            tar -czf "$ID-$VERSION-$platform.tar.gz" -C pkg extension.toml SKILL.md references scripts bin README.md LICENSE
          done
          ls -l ./*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: "*.tar.gz"
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: The release, with every platform's build
        env:
          GH_TOKEN: ${{ github.token }}
        # a tag with a pre-release part (v0.5.0-rc.1) is a GitHub pre-release, never the latest
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $pre
