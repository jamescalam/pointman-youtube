// The YouTube extension's commands and settings: the source of extension.toml's `params` and `[settings]` schemas.
// Command `youtube.<verb>` takes `<Verb>Params` and answers `<Verb>Result`. A field's comment is its description, and
// its buf.validate rules are its limits. YouTube's own limits are from the Data API v3 reference
// (https://developers.google.com/youtube/v3/docs/videos#properties).
syntax = "proto3";

package youtube.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "pointman/v1/options.proto";

// The extension's settings, per machine.
message Settings {
  // The label of the YouTube sign-in to use (main, for the vault's youtube.main). Empty: the only one signed in; with several, each call names one with account.
  string account = 1 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}, (pointman.v1.setting).default = ""];
  // How much of a video each upload request sends, in MiB (default 8). A dropped connection resends at most one.
  int32 chunk_mib = 2 [(buf.validate.field).int32 = {gte: 1, lte: 256}, (pointman.v1.setting).default = "8"];
}

// Who can see a video.
enum Privacy {
  PRIVACY_UNSPECIFIED = 0;
  // Only the channel, and people it shares it with.
  PRIVACY_PRIVATE = 1;
  // Anyone with the link; not in search or on the channel page.
  PRIVACY_UNLISTED = 2;
  // Everyone.
  PRIVACY_PUBLIC = 3;
}

// A video's category. Each value's number is YouTube's category id.
enum Category {
  CATEGORY_UNSPECIFIED = 0;
  CATEGORY_FILM_ANIMATION = 1;
  CATEGORY_AUTOS_VEHICLES = 2;
  CATEGORY_MUSIC = 10;
  CATEGORY_PETS_ANIMALS = 15;
  CATEGORY_SPORTS = 17;
  CATEGORY_TRAVEL_EVENTS = 19;
  CATEGORY_GAMING = 20;
  CATEGORY_PEOPLE_BLOGS = 22;
  CATEGORY_COMEDY = 23;
  CATEGORY_ENTERTAINMENT = 24;
  CATEGORY_NEWS_POLITICS = 25;
  CATEGORY_HOWTO_STYLE = 26;
  CATEGORY_EDUCATION = 27;
  CATEGORY_SCIENCE_TECHNOLOGY = 28;
  CATEGORY_NONPROFITS_ACTIVISM = 29;
}

// youtube.videos: the channel's videos, newest first.
message VideosParams {
  // How many videos to list (default 20).
  int32 page_size = 1 [(buf.validate.field).int32 = {gte: 1, lte: 50}, (pointman.v1.setting).default = "20"];
  // The next page: an earlier answer's next_page. Empty: the newest.
  string page = 2 [(buf.validate.field).string.max_len = 200];

  // The label of the YouTube sign-in to use for this call (spacesheep, for the vault's youtube.spacesheep), instead of the account setting.
  string account = 3 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
}

message VideosResult {
  string text = 1;
  repeated Video videos = 2;
  // The page after this one, for `page`; empty on the last.
  string next_page = 3;
  // The channel's uploads in all.
  int32 total = 4;
}

// One of the channel's videos, as youtube.videos lists it.
message Video {
  string id = 1;
  string title = 2;
  Privacy privacy = 3;
  // When it was published, or uploaded if it isn't public yet.
  google.protobuf.Timestamp published_at = 4;
  // When a private video goes public by itself, if it's scheduled.
  google.protobuf.Timestamp publish_at = 5;
  int64 views = 6;
  string url = 7;
}

// youtube.video: one video's details, as youtube.update would change them.
message VideoParams {
  // The video's id: the 11 characters after watch?v= or youtu.be/.
  string video = 1 [(buf.validate.field).required = true, (buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{11}$"];

  // The label of the YouTube sign-in to use for this call (spacesheep, for the vault's youtube.spacesheep), instead of the account setting.
  string account = 2 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
}

message VideoResult {
  string text = 1;
  string video = 2;
  string url = 3;
  string title = 4;
  string description = 5;
  repeated string tags = 6;
  // Its category's name, or YouTube's id when it isn't one youtube.update can set.
  string category = 7;
  Privacy privacy = 8;
  google.protobuf.Timestamp published_at = 9;
  google.protobuf.Timestamp publish_at = 10;
  // The channel's answer to YouTube's made-for-kids question, if it gave one.
  optional bool made_for_kids = 11;
  int64 views = 12;
  // Its length, as YouTube says it (PT12M3S).
  string duration = 13;
}

// youtube.upload: a new video on the channel, private unless it says otherwise.
message UploadParams {
  // The video: a board file (pointman://asset/<id>, which the node fetches) or a path in the folders the node lets the extension use.
  string file = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // Its title: at most 100 characters, without < or >.
  string title = 2 [(buf.validate.field).required = true, (buf.validate.field).string = {min_len: 1, max_len: 100, pattern: "^[^<>]*$"}];
  // Its description: at most 5,000 bytes, without < or >.
  string description = 3 [(buf.validate.field).string = {max_len: 5000, pattern: "^[^<>]*$"}];
  // Its tags, most important first: at most 500 characters in all, counting a comma between each and 2 for a tag with a space.
  repeated string tags = 4 [(buf.validate.field).repeated = {max_items: 100, items: {string: {min_len: 1, max_len: 100}}}];
  // Its category (default people_blogs, YouTube's own default).
  Category category = 5 [(pointman.v1.setting).default = "people_blogs"];
  // Who can see it (default private).
  Privacy privacy = 6 [(pointman.v1.setting).default = "private"];
  // When it goes public by itself (RFC 3339, 2026-11-02T15:00:00Z), in the future. Only for a private video.
  google.protobuf.Timestamp publish_at = 7;
  // Whether it's made for kids. Left out: the channel's default from YouTube Studio.
  optional bool made_for_kids = 8;
  // A thumbnail to set once it's up: a JPEG or PNG path on this machine, at most 2 MB. A board file goes through youtube.thumbnail afterwards.
  string thumbnail = 9;
  // A playlist to add it to: its id (PL…).
  string playlist = 10 [(buf.validate.field).string = {max_len: 64, pattern: "^([A-Za-z0-9_-]+)?$"}];
  // True once the channel's owner has said yes to this upload. Without it, nothing is uploaded.
  bool confirm = 11;

  // The label of the YouTube sign-in to use for this call (spacesheep, for the vault's youtube.spacesheep), instead of the account setting.
  string account = 12 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
}

message UploadResult {
  string text = 1;
  string video = 2;
  string url = 3;
  Privacy privacy = 4;
  google.protobuf.Timestamp publish_at = 5;
  int64 bytes = 6;
  // Whether the thumbnail was set; why not is in `text`.
  bool thumbnail = 7;
  // The playlist it was added to, if it was.
  string playlist = 8;
}

// youtube.update: change a video's details. Only the fields given change; the rest stay as they are.
message UpdateParams {
  // The video's id: the 11 characters after watch?v= or youtu.be/.
  string video = 1 [(buf.validate.field).required = true, (buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{11}$"];
  // A new title: at most 100 characters, without < or >.
  optional string title = 2 [(buf.validate.field).string = {min_len: 1, max_len: 100, pattern: "^[^<>]*$"}];
  // A new description, all of it: at most 5,000 bytes, without < or >.
  optional string description = 3 [(buf.validate.field).string = {max_len: 5000, pattern: "^[^<>]*$"}];
  // New tags, replacing all of them. Empty or left out: unchanged.
  repeated string tags = 4 [(buf.validate.field).repeated = {max_items: 100, items: {string: {min_len: 1, max_len: 100}}}];
  // A new category.
  optional Category category = 5;
  // Who can see it. Public publishes it.
  optional Privacy privacy = 6;
  // When it goes public by itself (RFC 3339), in the future: it stays private until then.
  google.protobuf.Timestamp publish_at = 7;
  // Whether it's made for kids.
  optional bool made_for_kids = 8;
  // True once the channel's owner has said yes. Needed to change a public video, make one public or schedule it.
  bool confirm = 9;

  // The label of the YouTube sign-in to use for this call (spacesheep, for the vault's youtube.spacesheep), instead of the account setting.
  string account = 10 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
}

message UpdateResult {
  string text = 1;
  string video = 2;
  string url = 3;
  // The fields it changed (title, description, tags, category, privacy, publish_at, made_for_kids).
  repeated string changed = 4;
  string title = 5;
  Privacy privacy = 6;
}

// youtube.thumbnail: a video's thumbnail.
message ThumbnailParams {
  // The video's id: the 11 characters after watch?v= or youtu.be/.
  string video = 1 [(buf.validate.field).required = true, (buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{11}$"];
  // The image: a board file (pointman://asset/<id>) or a path in the extension's folders. A JPEG or PNG, at most 2 MB.
  string file = 2 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // True once the channel's owner has said yes. Needed for a public video's.
  bool confirm = 3;

  // The label of the YouTube sign-in to use for this call (spacesheep, for the vault's youtube.spacesheep), instead of the account setting.
  string account = 4 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
}

message ThumbnailResult {
  string text = 1;
  string video = 2;
  string url = 3;
}

// youtube.add: a YouTube sign-in, added in the apps.
message AddParams {
  // What to call it (main): lowercase letters, digits, . _ -
  string name = 1 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
}

message AddResult {
  string text = 1;
}

// youtube.client: the Google OAuth client the sign-ins use, added in the apps.
message ClientParams {}

message ClientResult {
  string text = 1;
}

// youtube.live: the channel's live and upcoming broadcasts, each with its chat, and whether the sign-in may moderate.
message LiveParams {
  // The label of the YouTube sign-in to use for this call (spacesheep, for the vault's youtube.spacesheep), instead of the account setting.
  string account = 1 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
}

message LiveResult {
  string text = 1;
  // Live ones first, then upcoming, soonest first.
  repeated Broadcast broadcasts = 2;
  // The OAuth scopes the sign-in has.
  repeated string scopes = 3;
  // Whether they let it send, remove and time out in a chat the channel owns or moderates (youtube or youtube.force-ssl).
  bool can_moderate = 4;
  // Whether the channel is enabled for live streaming (YouTube Studio's Go live): without it, it has no broadcasts.
  bool can_stream = 5;
}

// One of the channel's broadcasts.
message Broadcast {
  // Its video's id, as youtube.chat and youtube.chat_watch take it.
  string video = 1;
  string title = 2;
  // live or upcoming.
  string status = 3;
  // Its live chat, for youtube.chat's chat_id; empty when it has none.
  string chat_id = 4;
  // When it started (live) or is set to start (upcoming).
  google.protobuf.Timestamp starts_at = 5;
  string url = 6;
}

// youtube.chat: a page of a live video's chat messages, oldest first, and when to ask for the next.
message ChatParams {
  // The live video's id: the 11 characters after watch?v= or youtu.be/. Any public live video's chat can be read. Or give chat_id.
  string video = 1 [(buf.validate.field).string.pattern = "^([A-Za-z0-9_-]{11})?$"];
  // The live chat's id (youtube.live's chat_id), instead of video.
  string chat_id = 2 [(buf.validate.field).string = {max_len: 200, pattern: "^\\S*$"}];
  // The next page: an earlier answer's page_token, for only the messages since. Empty: the latest messages.
  string page_token = 3 [(buf.validate.field).string = {max_len: 400, pattern: "^\\S*$"}];

  // The label of the YouTube sign-in to use for this call (spacesheep, for the vault's youtube.spacesheep), instead of the account setting.
  string account = 4 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
}

message ChatResult {
  string text = 1;
  // Oldest first.
  repeated ChatMessage messages = 2;
  // For the next call's page_token: the messages after these.
  string page_token = 3;
  // How long YouTube asks to wait before the next call, in milliseconds.
  int32 poll_ms = 4;
  string chat_id = 5;
  // When the chat went offline, if it has.
  google.protobuf.Timestamp offline_at = 6;
}

// One message in a live chat.
message ChatMessage {
  // Its id, for youtube.chat_remove.
  string id = 1;
  // Its author's display name.
  string author = 2;
  // Its author's channel (UC…), for youtube.chat_timeout.
  string author_channel_id = 3;
  // What it says, as YouTube shows it.
  string text = 4;
  google.protobuf.Timestamp at = 5;
  // Whether its author owns the chat's channel.
  bool is_owner = 6;
  // Whether its author moderates the chat.
  bool is_moderator = 7;
  // YouTube's type for it: textMessageEvent, superChatEvent, memberMilestoneChatEvent…
  string kind = 8;
}

// youtube.chat_watch: a live video's new chat messages posted to a thread in batches, until it's cancelled, the chat ends or minutes have gone by.
message ChatWatchParams {
  // The live video's id: the 11 characters after watch?v= or youtu.be/.
  string video = 1 [(buf.validate.field).required = true, (buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{11}$"];
  // The thread each batch is posted in (thr_123).
  string thread = 2 [(buf.validate.field).required = true, (buf.validate.field).string.pattern = "^(thr_)?[1-9][0-9]*$"];
  // How often it posts the messages since the last batch, in seconds (default 15; never sooner than YouTube asks).
  int32 every_seconds = 3 [(buf.validate.field).int32 = {gte: 5, lte: 300}, (pointman.v1.setting).default = "15"];
  // Who a batch @mentions (an agent's handle), so it wakes for each one. Empty: nobody.
  string mention = 4 [(buf.validate.field).string = {max_len: 65, pattern: "^(@?[a-z0-9][a-z0-9_-]{0,63})?$"}];
  // How long it watches at most, in minutes (default 180).
  int32 minutes = 5 [(buf.validate.field).int32 = {gte: 1, lte: 720}, (pointman.v1.setting).default = "180"];

  // The label of the YouTube sign-in to use for this call (spacesheep, for the vault's youtube.spacesheep), instead of the account setting.
  string account = 6 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
}

message ChatWatchResult {
  string text = 1;
  // The batches it posted.
  int32 batches = 2;
  // The messages in them.
  int32 messages = 3;
  // Why it stopped: cancelled, chat_ended or minutes.
  string stopped = 4;
  string chat_id = 5;
}

// youtube.chat_send: a message in a live video's chat, as the channel.
message ChatSendParams {
  // The live video's id: the 11 characters after watch?v= or youtu.be/.
  string video = 1 [(buf.validate.field).required = true, (buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{11}$"];
  // What it says: at most 200 characters.
  string text = 2 [(buf.validate.field).required = true, (buf.validate.field).string = {min_len: 1, max_len: 200}];
  // True once the channel's owner has said yes to sending these words. Without it, nothing is sent.
  bool confirm = 3;

  // The label of the YouTube sign-in to use for this call (spacesheep, for the vault's youtube.spacesheep), instead of the account setting.
  string account = 4 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
}

message ChatSendResult {
  string text = 1;
  // The message's id.
  string message_id = 2;
  string chat_id = 3;
}

// youtube.chat_remove: delete a message from a live chat the channel owns or moderates, and log it in a thread.
message ChatRemoveParams {
  // The live video's id, whose chat has the message. Or give chat_id.
  string video = 1 [(buf.validate.field).string.pattern = "^([A-Za-z0-9_-]{11})?$"];
  // The live chat's id, instead of video.
  string chat_id = 2 [(buf.validate.field).string = {max_len: 200, pattern: "^\\S*$"}];
  // The message's id (youtube.chat's id). It must be among the chat's latest 2,000 messages.
  string message_id = 3 [(buf.validate.field).required = true, (buf.validate.field).string = {min_len: 1, max_len: 200, pattern: "^\\S+$"}];
  // Why it's removed, for the log (spam, a scam link…).
  string reason = 4 [(buf.validate.field).required = true, (buf.validate.field).string = {min_len: 1, max_len: 200}];
  // The thread where the deletion is logged (thr_123): one line with the author, their words, the time and the reason.
  string thread = 5 [(buf.validate.field).required = true, (buf.validate.field).string.pattern = "^(thr_)?[1-9][0-9]*$"];
  // True once removing it was agreed (the owner's yes, or the event's spam rule). Without it, nothing is removed.
  bool confirm = 6;

  // The label of the YouTube sign-in to use for this call (spacesheep, for the vault's youtube.spacesheep), instead of the account setting.
  string account = 7 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
}

message ChatRemoveResult {
  string text = 1;
  string message_id = 2;
  // The message that was removed, as it was.
  ChatMessage message = 3;
  // The log's post in the thread (post_123); empty if it couldn't be posted (text says why).
  string logged = 4;
}

// youtube.chat_timeout: keep someone out of a live chat the channel owns or moderates for a while.
message ChatTimeoutParams {
  // The live video's id. Or give chat_id.
  string video = 1 [(buf.validate.field).string.pattern = "^([A-Za-z0-9_-]{11})?$"];
  // The live chat's id, instead of video.
  string chat_id = 2 [(buf.validate.field).string = {max_len: 200, pattern: "^\\S*$"}];
  // Their channel (UC…, youtube.chat's author_channel_id).
  string author_channel_id = 3 [(buf.validate.field).required = true, (buf.validate.field).string.pattern = "^UC[A-Za-z0-9_-]{22}$"];
  // For how long, in seconds: 10 to 86,400 (a day).
  int32 seconds = 4 [(buf.validate.field).required = true, (buf.validate.field).int32 = {gte: 10, lte: 86400}];
  // True once the owner has said yes to timing them out. Without it, nothing changes.
  bool confirm = 5;

  // The label of the YouTube sign-in to use for this call (spacesheep, for the vault's youtube.spacesheep), instead of the account setting.
  string account = 6 [(buf.validate.field).string = {max_len: 32, pattern: "^([a-z0-9][a-z0-9._-]*)?$"}];
}

message ChatTimeoutResult {
  string text = 1;
  // The ban's id.
  string ban_id = 2;
  string chat_id = 3;
  google.protobuf.Timestamp until = 4;
}
